[project]
name = "clinical-sql-agent"
version = "0.1.0"
description = "Text-to-SQL agent over synthetic clinical data (Synthea + PostgreSQL + LangGraph)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "S4IF-TP", email = "137278901+S4IF-TP@users.noreply.github.com" }]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "langgraph>=0.2",
    "sqlglot>=25",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "streamlit>=1.38",
    "pandas>=2.2",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.8"]

[project.scripts]
csql = "csql.__main__:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "csql"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
